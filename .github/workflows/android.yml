name: Build Sherry Album

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sherry-album-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Persist test signing key
        run: |
          if [ ! -f test-signing/sherry-test.jks ]; then
            mkdir -p test-signing
            keytool -genkeypair -keystore test-signing/sherry-test.jks -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 -dname 'CN=Sherry Album Test,O=Sherry,C=CN'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add test-signing/sherry-test.jks
            git commit -m 'Persist public debug signing key for test updates [skip ci]'
            git push origin HEAD:main
          fi
      - name: Tests, lint and APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Package
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SherryAlbum-0.1.0-test1.apk
          git rev-parse HEAD > dist/BUILD-COMMIT.txt
          cd dist
          sha256sum SherryAlbum-0.1.0-test1.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SherryAlbum-0.1.0-test1
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
